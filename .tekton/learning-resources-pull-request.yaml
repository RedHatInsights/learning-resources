# Pilot: image-based E2E pipeline v2 (koordinuje RHCLOUD-52375)
# Temporary fork reference — replace with upstream commit after shared pipeline merges.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/learning-resources.git?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "master"
    pipelinesascode.tekton.dev/pipeline: https://raw.githubusercontent.com/platex-rehor-bot/konflux-pipelines/8515cd579168107c6c92a3376d5a149b442864a3/pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: learning-resources
    appstudio.openshift.io/component: learning-resources
    pipelines.appstudio.openshift.io/type: build
  name: learning-resources-on-pull-request
  namespace: hcc-platex-services-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/learning-resources/learning-resources:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: build-tools/Dockerfile.hermetic
  - name: path-context
    value: .
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: '{"type": "npm", "path": "."}'
  - name: build-args
    value:
    - "LABEL_COMPONENT=learning-resources-hermetic"
    - "LABEL_DESCRIPTION=Learning Resources Frontend - Hermetic Build"
    - "LABEL_URL=https://github.com/RedHatInsights/learning-resources"
    - "LABEL_SUMMARY=Learning Resources Frontend"
  - name: target-stage
    value: deploy
  - name: rebuild
    value: "true"
  - name: workspace-setup-script
    value: |
      #!/bin/bash
      set -ex

      npm ci
  - name: unit-tests-script
    value: |
      #!/bin/bash
      set -ex

      npm run lint
      npm test -- --runInBand --no-cache
  - name: run-app-command
    value: caddy
  - name: run-app-args
    value:
    - "run"
    - "--config"
    - "/etc/caddy/Caddyfile"
    - "--adapter"
    - "caddyfile"
  - name: e2e-playwright-image
    value: mcr.microsoft.com/playwright:v1.59.0-noble@sha256:11707c5282fec52f0705aad3a23f46b3409b3de4aed378b3dbe118d8b8c87b67
  - name: e2e-base-url
    value: "https://stage.foo.redhat.com:1337/"
  - name: e2e-proxy-readiness-url
    value: "https://stage.foo.redhat.com:1337/"
  - name: e2e-tests-script
    value: |
      #!/bin/bash
      set -ex

      echo "Running Playwright tests..."
      npm run test:e2e
  - name: e2e-credentials-secret
    value: learning-resources-credentials-secret
  - name: frontend-proxy-routes-configmap
    value: learning-resources-dev-proxy-caddyfile-v2
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/platex-rehor-bot/konflux-pipelines
    - name: revision
      value: 8515cd579168107c6c92a3376d5a149b442864a3
    - name: pathInRepo
      value: pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-learning-resources
  taskRunSpecs:
    - pipelineTaskName: run-unit-tests
      podTemplate:
        securityContext:
          fsGroup: 1000
    - pipelineTaskName: run-e2e-tests
      serviceAccountName: build-pipeline-learning-resources
      podTemplate:
        securityContext:
          fsGroup: 1000
        hostAliases:
          - ip: "::1"
            hostnames:
              - "stage.foo.redhat.com"
          - ip: "127.0.0.1"
            hostnames:
              - "stage.foo.redhat.com"
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata:
        creationTimestamp: null
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
